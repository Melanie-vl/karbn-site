<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Getekende sporter die in een kleedkamer zijn sportschoen dichtknoopt, met een Karbn-zakje in zijn tas"><defs>
<filter id="relief" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="5" result="h"/>
<feDiffuseLighting in="h" surfaceScale="9" diffuseConstant="1.15" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="38"/></feDiffuseLighting>
<feComposite in="l" in2="SourceAlpha" operator="in" result="lm"/>
<feBlend in="SourceGraphic" in2="lm" mode="multiply" result="m"/>
<feComponentTransfer in="m"><feFuncR type="linear" slope="1.25" intercept="-.04"/><feFuncG type="linear" slope="1.25" intercept="-.04"/><feFuncB type="linear" slope="1.25" intercept="-.04"/></feComponentTransfer>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>
<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="hard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
</defs><g style="filter:contrast(1.1)">
<defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e3e3"/><stop offset="1" stop-color="#c7c7c7"/></linearGradient></defs>
<rect width="900" height="600" fill="url(#w)"/>
<g fill="#9d9d9d" stroke="#7c7c7c" stroke-width="3"><rect x="30" y="40" width="130" height="330" rx="6"/><rect x="170" y="40" width="130" height="330" rx="6"/><rect x="310" y="40" width="130" height="330" rx="6"/><rect x="450" y="40" width="130" height="330" rx="6"/><rect x="590" y="40" width="130" height="330" rx="6"/><rect x="730" y="40" width="130" height="330" rx="6"/></g>
<g stroke="#6b6b6b" stroke-width="3"><path d="M50 90H140M190 90H280M330 90H420M470 90H560M610 90H700M750 90H840"/><path d="M50 104H140M190 104H280M330 104H420M470 104H560M610 104H700M750 104H840"/></g>
<g fill="#6b6b6b"><rect x="138" y="190" width="8" height="40" rx="3"/><rect x="278" y="190" width="8" height="40" rx="3"/><rect x="418" y="190" width="8" height="40" rx="3"/><rect x="558" y="190" width="8" height="40" rx="3"/><rect x="698" y="190" width="8" height="40" rx="3"/><rect x="838" y="190" width="8" height="40" rx="3"/></g>
<rect y="470" width="900" height="130" fill="#1a1a1a"/>
<rect x="150" y="420" width="600" height="26" rx="4" fill="#8b6f4e"/><rect x="150" y="440" width="600" height="8" fill="#5e4a33"/>
<rect x="190" y="446" width="16" height="90" fill="#0f0f0f"/><rect x="694" y="446" width="16" height="90" fill="#0f0f0f"/>
<!-- tas met Karbn-zakje -->
<rect x="190" y="352" width="120" height="68" rx="14" fill="#0e0e0e"/><path d="M205 366H295" stroke="#cc0000" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(262 352) rotate(-18) scale(.55)"><g transform="rotate(-90) translate(-50 -100)"><path d="M50 5 C70 5 80 25 78 55 C77 80 70 100 72 125 C74 150 70 195 48 195 C28 195 24 170 28 145 C31 120 24 100 22 70 C20 35 32 5 50 5 Z" fill="#787b50"/><rect x="44" y="190" width="13" height="32" rx="2" fill="#0c0c0c"/><rect x="47" y="209" width="7" height="3" fill="#cc0000"/></g></g>
<rect x="190" y="372" width="120" height="48" rx="14" fill="#0e0e0e"/>
<ellipse cx="470" cy="540" rx="230" ry="12" fill="#000" opacity=".3"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#relief)">
 <path d="M420 410 L545 400" stroke="#111" stroke-width="44"/>
 <path d="M545 400 L560 505" stroke="#6a6a6a" stroke-width="24"/>
 <path d="M440 412 L388 330" stroke="#111" stroke-width="62"/>
 <path d="M412 345 L468 436 L556 490" stroke="#6a6a6a" stroke-width="20"/>
 <path d="M562 512 L636 512" stroke="#f4f4f4" stroke-width="24"/><path d="M562 524 L640 524" stroke="#cc0000" stroke-width="6"/>
 <path d="M585 500 l24 -4 M582 486 l24 -4" stroke="#bdbdbd" stroke-width="4"/>
</g>
<circle cx="562" cy="494" r="12" fill="#6a6a6a"/>
<circle cx="415" cy="292" r="29" fill="#6a6a6a"/><path d="M388 284 Q410 258 440 280" stroke="#111" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M530 472 L544 481" stroke="#cc0000" stroke-width="10" stroke-linecap="round"/>
</g><rect width="900" height="600" fill="url(#hard)"/><rect width="900" height="600" fill="url(#vig)"/><rect width="900" height="600" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/></svg>
