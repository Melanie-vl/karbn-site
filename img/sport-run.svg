<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Getekende hardloper bij zonsopgang met een rode polsband"><defs>
<filter id="relief" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="5" result="h"/>
<feDiffuseLighting in="h" surfaceScale="9" diffuseConstant="1.15" lighting-color="#fff" result="l"><feDistantLight azimuth="235" elevation="38"/></feDiffuseLighting>
<feComposite in="l" in2="SourceAlpha" operator="in" result="lm"/>
<feBlend in="SourceGraphic" in2="lm" mode="multiply" result="m"/>
<feComponentTransfer in="m"><feFuncR type="linear" slope="1.25" intercept="-.04"/><feFuncG type="linear" slope="1.25" intercept="-.04"/><feFuncB type="linear" slope="1.25" intercept="-.04"/></feComponentTransfer>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>
<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="hard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
</defs><g style="filter:contrast(1.1)">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efefef"/><stop offset="1" stop-color="#cfcfcf"/></linearGradient>
<filter id="b"><feGaussianBlur stdDeviation="6"/></filter></defs>
<rect width="900" height="600" fill="url(#g)"/>
<circle cx="640" cy="250" r="190" fill="#fff" opacity=".85"/>
<g fill="#bdbdbd"><rect x="40" y="260" width="90" height="210"/><rect x="140" y="320" width="70" height="150"/><rect x="215" y="230" width="100" height="240"/><rect x="760" y="300" width="80" height="170"/><rect x="845" y="250" width="70" height="220"/></g>
<g fill="#a8a8a8"><rect x="55" y="280" width="14" height="14"/><rect x="85" y="280" width="14" height="14"/><rect x="235" y="250" width="14" height="14"/><rect x="265" y="250" width="14" height="14"/><rect x="235" y="290" width="14" height="14"/></g>
<rect y="470" width="900" height="130" fill="#141414"/>
<path d="M0 535H900" stroke="#fff" stroke-width="5" stroke-dasharray="60 50" opacity=".85"/>
<ellipse cx="420" cy="472" rx="170" ry="12" fill="#000" opacity=".35" filter="url(#b)"/>
<g stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#relief)">
 <!-- achterste been -->
 <path d="M420 300 L385 355" stroke="#111" stroke-width="40"/>
 <path d="M385 355 L325 392" stroke="#5c5c5c" stroke-width="22"/>
 <path d="M325 392 L292 416" stroke="#f4f4f4" stroke-width="20"/><path d="M292 428 L330 410" stroke="#cc0000" stroke-width="6"/>
 <!-- achterste arm -->
 <path d="M452 205 L395 250" stroke="#5c5c5c" stroke-width="19"/><path d="M395 250 L372 212" stroke="#5c5c5c" stroke-width="17"/>
 <circle cx="371" cy="208" r="11" fill="#5c5c5c" stroke="none"/>
 <!-- romp -->
 <path d="M462 192 L422 298" stroke="#111" stroke-width="58"/>
 <!-- voorste been -->
 <path d="M420 300 L482 322" stroke="#111" stroke-width="42"/>
 <path d="M488 326 L478 418" stroke="#5c5c5c" stroke-width="22"/>
 <path d="M478 424 L528 436" stroke="#f4f4f4" stroke-width="20"/><path d="M474 446 L534 448" stroke="#cc0000" stroke-width="6"/>
 <!-- voorste arm -->
 <path d="M468 205 L518 244" stroke="#5c5c5c" stroke-width="19"/><path d="M518 244 L552 206" stroke="#5c5c5c" stroke-width="17"/>
 <path d="M542 216 L556 202" stroke="#cc0000" stroke-width="10"/>
 <circle cx="560" cy="198" r="11" fill="#5c5c5c" stroke="none"/>
</g>
<circle cx="478" cy="152" r="28" fill="#5c5c5c"/>
<path d="M452 142 Q478 122 506 142" stroke="#cc0000" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M452 136 Q470 116 496 124" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
</g><rect width="900" height="600" fill="url(#hard)"/><rect width="900" height="600" fill="url(#vig)"/><rect width="900" height="600" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/></svg>
